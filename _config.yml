# Site settings
#title: Bootstrap Template
author: CoolV1994
#description: >
#  Bootstrap 5.3.7 Template for GitHub Pages
#baseurl: "/bootstrap-test"
#url: "https://gawdtemplates.github.io"


# Theme Settings
theme:
# theme: light | dark | auto
  mode: dark
# theme-color: HEX_COLOR
  color: 712cf9
# theme-rtl: true | false
  rtl: false
# theme-version: 5.3.8
  version: 5.3.8
# theme-cdn: CDN_URL
  cdn: "https://gawdtemplates.github.io/bootstrap-assets/"
# theme-css: CSS_URL
  css-url: "https://gawdtemplates.github.io/bootstrap-assets/5.3.8/css/bootstrap.min.css"
# theme-js: JS_URL
  js-url: "https://gawdtemplates.github.io/bootstrap-assets/5.3.8/js/bootstrap.min.js"


# jQuery Settings
jquery:
  version: 3.7.1
  cdn: "https://code.jquery.com/"
  url: "https://code.jquery.com/jquery-3.7.1.min.js"


# Popper Settings
popper:
  version: 2.11.8
  cdn: "https://unpkg.com/@popperjs/core@2"
  url: "https://unpkg.com/@popperjs/core@2.11.8/dist/umd/popper.min.js"

# Build Settings
markdown: kramdown

# Post Pagination
paginate: 10
paginate_path: "/page/:num/"

# Include Paths when Rendering
include:
  - _pages
  - _api
  - _examples

# Custom Posts Collections
collections:
  blog:
    output: true
    url: /blog/
  authors:
    output: true
    url: /authors/
  albums:
    output: true
    url: /albums/
  docs:
    output: true
    url: /docs/


# Default Values per Path
defaults:
  - scope:
      path: "images"
    values:
      image: true
      album: images
  - scope:
      path: "images/sample"
    values:
      image: true
      album: sample
  - scope:
      path: "files"
    values:
      album: Files
  - scope:
      path: "docs"
    values:
      album: Documents
  - scope:
      path: "dashboard"
    values:
      dashboard: true
  - scope:
      path: "examples"
    values:
      album: Examples
  - scope:
      path: "examples/modules"
    values:
      album: Modules
